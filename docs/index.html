<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZINEイベントカレンダー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #fff;
      color: #111;
      font-size: 14px;
      padding: 1.5rem 1rem;
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .meta a { color: inherit; }
    .meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 1.2rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }

    .filter-btn {
      padding: 0.3rem 0.8rem;
      border: 1px solid #111;
      background: transparent;
      font-size: 0.75rem;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: all 0.15s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: #111;
      color: #fff;
    }

    .month-section { margin-bottom: 2rem; }

    .month-heading {
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      border-bottom: 1px solid #111;
      padding-bottom: 0.3rem;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .event-list { list-style: none; }

    .event-item {
      align-items: start;
      display: grid;
      grid-template-columns: minmax(140px, max-content) 1fr;
      gap: 0.5rem 1rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #eee;
    }

    .event-date {
      font-size: 0.75rem;
      color: #555;
      padding-top: 0.15rem;
      white-space: nowrap;
      word-break: keep-all;
    }

    .event-title {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: #111;
      text-decoration: none;
      line-height: 1.4;
    }

    .event-title:hover { text-decoration: underline; }

    .event-venue {
      display: block;
      font-size: 0.75rem;
      color: #777;
      margin-top: 0.15rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 0.1rem 0.4rem;
      margin-left: 0.3rem;
      vertical-align: middle;
      background: #eee;
      color: #444;
    }

    .badge--tabf         { background: #000; color: #fff; }
    .badge--bunfree      { background: #c44; color: #fff; }
    .badge--mzfest       { background: #336699; color: #fff; }
    .badge--zinefes_note { background: #447744; color: #fff; }
    .badge--artbookosaka { background: #884488; color: #fff; }
    .badge--comitia      { background: #cc6600; color: #fff; }
    .badge--k_comitia    { background: #cc6600; color: #fff; }
    .badge--comiket      { background: #333; color: #fff; }
    .badge--manual       { background: #111; color: #fff; font-weight: bold; }
    .badge--techbookfest { background: #e07020; color: #fff; }

    .filter-btn--diybooks {
      border: 2px solid #111;
      font-weight: bold;
      letter-spacing: 0.08em;
      position: relative;
    }
    .filter-btn--diybooks::before {
      content: "★ ";
      font-size: 0.7rem;
    }
    .filter-btn--diybooks.active,
    .filter-btn--diybooks:hover {
      background: #111;
      color: #fff;
    }

    .empty { color: #999; font-size: 0.85rem; padding: 1rem 0; }

    @media (max-width: 480px) {
      .event-item { grid-template-columns: 1fr; gap: 0.2rem; }
    }

    /* ── 入稿日チェック ───────────────────── */
    .event-item { grid-template-columns: 1.4rem minmax(140px, max-content) 1fr; }
    .event-pick {
      width: 1rem; height: 1rem; margin-top: 0.15rem;
      accent-color: #111; cursor: pointer;
    }
    .event-item.is-picked { background: #f6f6f6; }

    .deadline-bar {
      position: sticky;
      bottom: 0;
      margin: 1.5rem -1rem 0;
      padding: 0.9rem 1rem 1rem;
      background: #fff;
      border-top: 2px solid #111;
    }
    .deadline-hint { font-size: 0.8rem; color: #555; }
    .deadline-bar[data-state="idle"] .deadline-result { display: none; }
    .deadline-bar[data-state="active"] .deadline-hint { display: none; }

    .deadline-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 0.5rem; flex-wrap: wrap;
    }
    .deadline-label { font-size: 0.75rem; color: #555; }
    .deadline-date { font-size: 1.35rem; font-weight: bold; letter-spacing: 0.02em; }
    .deadline-sub { font-size: 0.75rem; color: #555; margin-top: 0.2rem; line-height: 1.5; }
    .deadline-clear {
      font-size: 0.7rem; background: none; border: none; color: #555;
      text-decoration: underline; cursor: pointer; padding: 0;
    }
    .deadline-offers {
      list-style: none; margin-top: 0.7rem;
      display: grid; gap: 0.4rem;
    }
    .deadline-offers a {
      display: block; padding: 0.5rem 0.7rem;
      border: 1px solid #111; color: #111; text-decoration: none;
      font-size: 0.8rem; line-height: 1.45;
    }
    .deadline-offers a:hover, .deadline-offers a:focus-visible { background: #111; color: #fff; }
    .deadline-offers small { display: block; font-size: 0.7rem; opacity: 0.75; }
    .deadline-bar.is-late .deadline-date { text-decoration: line-through; }

    @media (max-width: 480px) {
      .event-item { grid-template-columns: 1.4rem 1fr; }
      .event-item > div { grid-column: 2; }
      .deadline-date { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <h1>ZINE EVENT CALENDAR</h1>
  <p class="meta" id="updated-at">読み込み中...</p>
  <p class="meta" id="submit-link" hidden>ZINEイベントの主催者の方へ：<a id="submit-link-a" href="#" target="_blank" rel="noopener">掲載のお申し込み（無料）</a></p>

  <div class="filters">
    <button class="filter-btn active" data-cat="all">ALL</button>
    <button class="filter-btn" data-cat="アートブックフェア">ART BOOK FAIR</button>
    <button class="filter-btn" data-cat="ZINEフェス">ZINE FEST</button>
    <button class="filter-btn" data-cat="まちのZINEフェス">まちのZINEフェス</button>
    <button class="filter-btn" data-cat="文学フリマ">文学フリマ</button>
    <button class="filter-btn" data-cat="コミティア">コミティア</button>
    <button class="filter-btn" data-cat="コミックマーケット">コミケ</button>
    <button class="filter-btn" data-cat="技術書典">技術書典</button>
    <button class="filter-btn" data-cat="その他">その他</button>
    <button class="filter-btn filter-btn--diybooks" data-cat="DIY BOOKS">DIY BOOKS</button>
  </div>

  <div id="calendar"></div>

  <div class="deadline-bar" id="deadline-bar" data-state="idle" aria-live="polite">
    <p class="deadline-hint">出たいイベントにチェックを入れると、印刷の入稿日の目安が分かります。</p>
    <div class="deadline-result" id="deadline-result"></div>
  </div>

  <script>
    fetch('./events.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => init(data))
      .catch(() => {
        document.getElementById('calendar').innerHTML =
          '<p class="empty">イベント情報を読み込めませんでした。</p>';
      });


    // ───────────────────────────────────────────
    // 入稿日チェックの設定（ここだけ書き換えればOK）
    // ───────────────────────────────────────────
    const PLAN = {
      // 外注の印刷所へ入稿する目安：開催日の何日前か（仮の値）
      printLeadDays: 14,
      // 入稿日が土日にかかったら直前の金曜に前倒しする
      avoidWeekend: true,
      // スクール：修了日が入稿日より前の期を「間に合う」として案内する
      // 例 { name: '11期', start: '2026-11-02', end: '2026-12-21', url: 'https://diybooks.jp/pages/zine-school' }
      schools: [],
      schoolUrl: 'https://diybooks.jp/pages/zine-school',
      // いつでも始められるZINEコース（旧アーカイブ）
      courseUrl: '',
      // まだZINE（書き込める束見本）
      madaZineUrl: '',
      // イベント掲載フォーム（GoogleフォームのURL）
      formUrl: 'https://docs.google.com/forms/d/e/1FAIpQLSctX_BLX_s9pn0JIbHBbbdkBvu6P6QH9dF6XB3ZQqoK7By6zg/viewform'
    };

    const picked = new Set();
    function evKey(e) { return (e.date || '') + '|' + e.title; }
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function parseDate(str) {
      const p = str.split('-').map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }
    function fmt(d) {
      const w = '日月火水木金土'[d.getDay()];
      return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + w + '）';
    }
    function today0() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
    function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

    function calcDeadline(eventDate) {
      const d = new Date(eventDate);
      d.setDate(d.getDate() - PLAN.printLeadDays);
      let shifted = false;
      if (PLAN.avoidWeekend) {
        while (d.getDay() === 0 || d.getDay() === 6) { d.setDate(d.getDate() - 1); shifted = true; }
      }
      return { date: d, shifted: shifted };
    }

    function updateDeadline() {
      const bar = document.getElementById('deadline-bar');
      const box = document.getElementById('deadline-result');
      const chosen = allEvents.filter(function(e) { return e.date && picked.has(evKey(e)); })
        .sort(function(a, b) { return a.date < b.date ? -1 : 1; });

      if (!chosen.length) { bar.dataset.state = 'idle'; bar.classList.remove('is-late'); box.innerHTML = ''; return; }
      bar.dataset.state = 'active';

      const first = chosen[0];
      const dl = calcDeadline(parseDate(first.date));
      const now = today0();
      const left = daysBetween(now, dl.date);
      const late = left < 0;
      bar.classList.toggle('is-late', late);

      let sub = '';
      if (chosen.length > 1) sub += '選んだ' + chosen.length + '件のうち、いちばん早い「' + esc(first.title) + '」に合わせています。';
      else sub += '「' + esc(first.title) + '」（' + esc(first.date_display || first.date) + '）に合わせています。';
      sub += '<br>外注の印刷所で、開催の' + PLAN.printLeadDays + '日前を目安にしています' + (dl.shifted ? '（土日を避けて前倒し）' : '') + '。';
      if (late) sub += '<br>外注の目安日は過ぎています。店内のリソグラフなら間に合う場合があるので、ご相談ください。';
      else sub += '<br>今日から入稿まで、あと' + left + '日です。';

      const offers = [];
      if (!late) {
        const school = PLAN.schools
          .filter(function(s) { return parseDate(s.start) >= now && parseDate(s.end) <= dl.date; })
          .sort(function(a, b) { return a.start < b.start ? -1 : 1; })[0];
        if (school) {
          offers.push('<li><a href="' + esc(school.url || PLAN.schoolUrl) + '" target="_blank" rel="noopener">' +
            'ZINEスクール' + esc(school.name) + 'で、仲間と一緒に仕上げる' +
            '<small>' + esc(fmt(parseDate(school.start))) + '開講、' + esc(fmt(parseDate(school.end))) + '修了。入稿日に間に合います</small></a></li>');
        }
      }
      if (PLAN.courseUrl) {
        offers.push('<li><a href="' + esc(PLAN.courseUrl) + '" target="_blank" rel="noopener">' +
          'ZINEコースで、今日から自分のペースで始める' +
          '<small>音声とスライドで進めるコース。開講日を待たずに始められます</small></a></li>');
      }
      if (PLAN.madaZineUrl) {
        offers.push('<li><a href="' + esc(PLAN.madaZineUrl) + '" target="_blank" rel="noopener">' +
          'まだZINEで、台割と締切を手元に置く' +
          '<small>書き込める束見本に、台割シートとスケジュールつき</small></a></li>');
      }

      box.innerHTML =
        '<div class="deadline-head">' +
          '<div><p class="deadline-label">入稿日の目安</p><p class="deadline-date">' + fmt(dl.date) + '</p></div>' +
          '<button type="button" class="deadline-clear" id="deadline-clear">選択を解除</button>' +
        '</div>' +
        '<p class="deadline-sub">' + sub + '</p>' +
        (offers.length ? '<ul class="deadline-offers">' + offers.join('') + '</ul>' : '');

      document.getElementById('deadline-clear').addEventListener('click', function() {
        picked.clear(); render(); updateDeadline();
      });
    }

    let allEvents = [];
    let currentCat = 'all';

    // 当月の年月プレフィックス（例: "2026-03"）を返す
    function currentMonthPrefix() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      return y + '-' + m;
    }

    if (PLAN.formUrl) {
      document.getElementById('submit-link-a').href = PLAN.formUrl;
      document.getElementById('submit-link').hidden = false;
    }

    function init(data) {
      const allRaw = data.events || [];

      // 当月以降のみ表示（日付なしは念のため含める）
      const cutoff = currentMonthPrefix();
      allEvents = allRaw.filter(function(e) {
        if (!e.date) return true;
        return e.date.slice(0, 7) >= cutoff;
      });

      const d = new Date(data.updated_at);
      document.getElementById('updated-at').textContent =
        '最終更新: ' + d.toLocaleDateString('ja-JP');

      render();

      document.querySelectorAll('.filter-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(function(b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          currentCat = btn.dataset.cat;
          render();
        });
      });
    }

    function render() {
      const cal = document.getElementById('calendar');
      const filtered = currentCat === 'all'
        ? allEvents
        : allEvents.filter(function(e) { return e.category === currentCat; });
      // 日付順に並べ直す（念のため）
      const events = filtered.slice().sort(function(a, b) {
        const da = a.date || '9999-99-99';
        const db = b.date || '9999-99-99';
        return da < db ? -1 : da > db ? 1 : 0;
      });

      if (!events.length) {
        cal.innerHTML = '<p class="empty">該当するイベントがありません。</p>';
        return;
      }

      // 月ごとにグループ化
      const grouped = {};
      events.forEach(function(e) {
        const m = (e.date || '').slice(0, 7) || '未定';
        if (!grouped[m]) grouped[m] = [];
        grouped[m].push(e);
      });

      cal.innerHTML = Object.keys(grouped).sort().map(function(month) {
        const parts = month.split('-');
        const label = month === '未定' ? '未定' : parts[0] + '年' + parseInt(parts[1]) + '月';
        const items = grouped[month].map(function(ev) {
          const k = evKey(ev);
          const on = picked.has(k);
          return '<li class="event-item' + (on ? ' is-picked' : '') + '">' +
            (ev.date
              ? '<input type="checkbox" class="event-pick" data-key="' + esc(k) + '"' + (on ? ' checked' : '') +
                ' aria-label="' + esc(ev.title) + 'の入稿日を調べる">'
              : '<span></span>') +
            '<span class="event-date">' + (ev.date_display || ev.date || '未定') + '</span>' +
            '<div>' +
              '<a class="event-title" href="' + ev.url + '" target="_blank" rel="noopener">' +
                ev.title +
                '<span class="badge badge--' + ev.source + '">' + ev.category + '</span>' +
              '</a>' +
              '<span class="event-venue">📍 ' + ev.venue + '</span>' +
            '</div>' +
          '</li>';
        }).join('');

        return '<div class="month-section">' +
          '<h2 class="month-heading">' + label + '</h2>' +
          '<ul class="event-list">' + items + '</ul>' +
          '</div>';
      }).join('');

      cal.querySelectorAll('.event-pick').forEach(function(cb) {
        cb.addEventListener('change', function() {
          if (cb.checked) picked.add(cb.dataset.key); else picked.delete(cb.dataset.key);
          cb.closest('.event-item').classList.toggle('is-picked', cb.checked);
          updateDeadline();
        });
      });
    }
  </script>
</body>
</html>
